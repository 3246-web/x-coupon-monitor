name: Coupon Monitor Scheduler

on:
  schedule:
    # 日本時間 09:00〜24:00 (UTC 00:00〜15:00) の間、20分ごとに自動実行
    - cron: '*/20 0-15 * * *'
  workflow_dispatch: # 手動ボタン

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write # しおり(last_id.txt)を自動更新するための権限

    steps:
      - name: コードを取得
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要なライブラリのインストール
        run: pip install requests

      - name: 監視スクリプトを実行
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python main.py

      - name: しおり(last_id.txt)をリポジトリに保存
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_id.txt
          git commit -m "Update last_id bookmark [skip ci]" || exit 0
          git push
